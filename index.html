<head>

  <link rel="stylesheet" crossorigin href="./assets/index-B4Srh_KB.css">
</head>
<body>
  <div id="app"></div>
  <div id="o-hud">
    <span id="o-speed">0</span><span id="o-unit">KM/H</span>
    <div id="o-bars"><div id="o-bar-speed"><i></i></div><div id="o-bar-jet"><i></i></div></div>
    <div id="o-biome"></div>
    <div id="o-seed"></div>
  </div>
  <div id="run">
    <span id="run-time">0:00</span><span id="run-dist">0.0 km</span><span id="run-lives"></span>
    <div id="run-cash">$0</div>
    <div id="o-drive" style="font-size:12px;font-weight:800;letter-spacing:2px;opacity:.9;color:#8fd8ff"></div>
    <div id="o-ammo" class="hidden" style="font-size:12px;font-weight:800;letter-spacing:1px;opacity:.9"></div>
    <div id="run-best"></div>
    <div id="run-stars"></div>
    <div id="run-arrest"><div id="run-arrest-fill"></div><span>ARREST</span></div>
    <div id="o-dmg-box"><div id="o-dmg"></div><span>DAMAGE</span></div>
  </div>
  <div id="o-back"></div>
  <div id="o-goal"><i>↑</i><span>STATION</span><small></small></div>
  <canvas id="o-garage" class="hidden"></canvas>
  <div id="popups"></div>
  <div id="over" class="screen hidden">
    <h2 id="over-title">BUSTED</h2>
    <div id="over-stats">
      <div>PLACE <b id="over-place"></b></div>
      <div>TIME <b id="over-time"></b></div>
      <div>DISTANCE <b id="over-dist"></b></div>
      <div>EARNED <b id="over-money"></b></div>
      <div>TAKEDOWNS <b id="over-take"></b></div>
      <div>NEAR MISSES <b id="over-near"></b></div>
      <div>BEST AIR <b id="over-air"></b></div>
    </div>
    <table id="over-board">
      <thead><tr><th>#</th><th>TIME</th><th>DISTANCE</th></tr></thead>
      <tbody id="over-table"></tbody>
    </table>
    <p class="hint">Enter / R / A / tap for the next run</p>
  </div>
  <div id="pause" class="screen hidden">
    <h2>PAUSED</h2>
    <p class="hint">P / Esc / Menu to resume</p>
  </div>
  <div id="o-loading">
    <h1 id="o-title">HOT PURSUIT</h1>
    <div id="o-load-msg">GENERATING LAND</div>
    <div id="o-vr-slot"></div>
    <div id="o-update"></div>
  </div>
</body>
</html>
